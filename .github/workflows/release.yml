name: Release

# Push a tag like v0.1.0 to build ready-made downloads and publish a release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: antares-windows-x86_64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: antares-linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: antares-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: antares-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: antares-macos-x86_64 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.name }}"
          cp README.md LICENSE "dist/${{ matrix.name }}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/antares.exe" "${{ matrix.name }}/"
            7z a "${{ matrix.name }}.zip" "${{ matrix.name }}" > /dev/null
          else
            cp "../target/${{ matrix.target }}/release/antares" "${{ matrix.name }}/"
            tar -czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.*

  check:
    name: Check a downloaded copy works
    needs: build
    runs-on: ubuntu-22.04
    steps:
      # No checkout on purpose: this is what a user who downloads Antares has.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: antares-linux-x86_64
      - name: Run and compile a program
        run: |
          tar -xzf antares-linux-x86_64.tar.gz
          export PATH="$PWD/antares-linux-x86_64:$PATH"
          mkdir project && cd project
          printf 'to square(x) = x * x\nshow "Hello from Antares", square(12)\n' > hello.ant
          antares version
          antares hello.ant | grep -q "Hello from Antares 144"
          antares build hello.ant
          ./hello | grep -q "Hello from Antares 144"
          antares build hello.ant packed --pack
          ./packed | grep -q "Hello from Antares 144"

  release:
    name: Publish the release
    needs: [build, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum antares-* > SHA256SUMS.txt
          cat > notes.md <<EOF
          ## Install

          **Windows** (PowerShell):

              irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex

          **macOS and Linux**:

              curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh

          Or download the file for your computer below, unpack it, and put \`antares\` on your PATH.
          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) and the
          [language reference (PDF)](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/Antares_Language_Reference.pdf).

          | Computer | File |
          |---|---|
          | Windows (64-bit) | antares-windows-x86_64.zip |
          | macOS, Apple Silicon (M1 and later) | antares-macos-arm64.tar.gz |
          | macOS, Intel | antares-macos-x86_64.tar.gz |
          | Linux, x86-64 | antares-linux-x86_64.tar.gz |
          | Linux, ARM64 | antares-linux-arm64.tar.gz |
          EOF
          gh release create "$GITHUB_REF_NAME" antares-* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Antares ${GITHUB_REF_NAME#v}" --notes-file notes.md

  verify-install:
    name: Install script (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.antares/bin/antares" version
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\Programs\Antares\antares.exe" version
