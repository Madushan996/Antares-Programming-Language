name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Self-check suites
        shell: bash
        run: |
          for t in check features engine integers graphics sound deep_learning; do
            ./target/release/antares tests/$t.ant
          done

      - name: Examples
        shell: bash
        run: |
          for e in hello line xor ask train_save; do
            echo "== $e"
            ./target/release/antares examples/$e.ant
          done

      - name: Language models (offline, against a pretend service)
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" tests/check_models.py

      - name: Packed programs match the interpreter
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" tests/compare_compiled.py --pack

      - name: Keyboard input in a terminal
        if: runner.os == 'Linux'
        run: |
          out=$( (sleep 2; printf 'w\033[A'; sleep 3) \
            | timeout 30 script -qec "./target/release/antares tests/keys.ant" /dev/null | tr -d '\r')
          echo "$out"
          echo "$out" | grep -q "keys: w up"

  compiled:
    name: Compiled programs match the interpreter
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: python3 tests/compare_compiled.py
